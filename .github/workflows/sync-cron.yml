name: Scheduled sync

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: scheduled-sync-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call hourly sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure APP_URL and CRON_SECRET as GitHub Actions secrets." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --retry-max-time 60 --max-time 330 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync"

  worker:
    if: github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call queue worker endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure APP_URL and CRON_SECRET as GitHub Actions secrets." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --retry-max-time 60 --max-time 330 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/worker"
